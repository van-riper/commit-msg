[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["."]

[tool.ruff.lint.per-file-ignores]
# The hook's whole job is to detect these glyphs and emit CLI output;
# terse docstrings and the wrapped error string are deliberate.
"commit_msg.py" = [
    "RUF001",  # ambiguous-unicode: the FORBIDDEN_CHARS glyphs are the point
    "T201",    # print: the hook reports to stderr by design
    "DOC201",  # docstring-missing-returns: one-line docstrings are enough
    "ISC004",  # implicit concat: the multi-line error message reads fine
    "PIE810",  # multiple startswith: kept as separate readable clauses
]
# Test conventions: asserts, fixtures, and parametrized bools are expected.
"test_commit_msg.py" = [
    "S101",    # assert: pytest's core mechanism
    "ANN001",  # missing annotation: tmp_path is a typed pytest fixture
    "FBT001",  # boolean positional: parametrized flags, not an API
    "PT018",   # composite assertion: readable as one line here
]
